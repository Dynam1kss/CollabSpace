services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabspace}
      POSTGRES_DB: ${POSTGRES_DB:-collabspace}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # перехоплювач пошти для розробки: лист нікуди не йде, а лягає у веб-скриньку
  # на 1080. Потрібен, бо лист відновлення пароля інакше нічим не перевірити,
  # а слати справжні листи з дев-машини не варто. У проді цього сервісу нема —
  # там SMTP_HOST дивиться на справжній smtp
  maildev:
    image: maildev/maildev:2.1.0
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '1080:1080'

  # coturn:
  #   image: coturn/coturn:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data:
  redis_data:
