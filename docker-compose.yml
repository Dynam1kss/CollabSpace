services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabspace}
      POSTGRES_DB: ${POSTGRES_DB:-collabspace}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # coturn:
  #   image: coturn/coturn:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data:
  redis_data:
